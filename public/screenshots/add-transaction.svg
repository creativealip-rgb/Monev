<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="375" height="812" fill="#F0F9FF"/>
  
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#0EA5E9"/>
  <text x="187" y="28" text-anchor="middle" fill="white" font-size="14" font-weight="600">9:41</text>
  
  <!-- Header -->
  <rect x="0" y="44" width="375" height="60" fill="white"/>
  <text x="40" y="82" fill="#0F172A" font-size="18" font-weight="700">Catat Transaksi</text>
  
  <!-- Amount Input -->
  <rect x="20" y="120" width="335" height="80" rx="16" fill="white"/>
  <text x="187" y="155" text-anchor="middle" fill="#64748B" font-size="14">Jumlah</text>
  <text x="187" y="185" text-anchor="middle" fill="#0F172A" font-size="32" font-weight="800">Rp 0</text>
  
  <!-- Type Toggle -->
  <rect x="20" y="220" width="335" height="50" rx="12" fill="#DCFCE7"/>
  <rect x="20" y="220" width="167" height="50" rx="12" fill="#10B981"/>
  <text x="103" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="700">Pengeluaran</text>
  <text x="270" y="250" text-anchor="middle" fill="#059669" font-size="14" font-weight="700">Pemasukan</text>
  
  <!-- Category -->
  <rect x="20" y="290" width="335" height="60" rx="12" fill="white"/>
  <text x="40" y="325" fill="#64748B" font-size="14">Kategori</text>
  <text x="335" y="325" text-anchor="end" fill="#0F172A" font-size="14" font-weight="600">Makanan →</text>
  
  <!-- Description -->
  <rect x="20" y="370" width="335" height="60" rx="12" fill="white"/>
  <text x="40" y="405" fill="#64748B" font-size="14">Deskripsi</text>
  <text x="335" y="405" text-anchor="end" fill="#CBD5E1" font-size="14">Opsional →</text>
  
  <!-- Payment Method -->
  <rect x="20" y="450" width="335" height="60" rx="12" fill="white"/>
  <text x="40" y="485" fill="#64748B" font-size="14">Pembayaran</text>
  <text x="335" y="485" text-anchor="end" fill="#0F172A" font-size="14" font-weight="600">Cash →</text>
  
  <!-- Voice Input -->
  <rect x="20" y="530" width="335" height="80" rx="16" fill="linear-gradient(135deg, #0EA5E9, #06B6D4)"/>
  <circle cx="187" cy="560" r="20" fill="white" opacity="0.3"/>
  <text x="187" y="600" text-anchor="middle" fill="white" font-size="14" font-weight="600">Tekan untuk rekam suara</text>
  
  <!-- Save Button -->
  <rect x="20" y="650" width="335" height="56" rx="28" fill="#0EA5E9"/>
  <text x="187" y="685" text-anchor="middle" fill="white" font-size="16" font-weight="700">Simpan Transaksi</text>
  
  <!-- Bottom Nav Placeholder -->
  <rect x="0" y="750" width="375" height="62" fill="white" stroke="#E2E8F0"/>
  <circle cx="74" cy="781" r="20" fill="#E2E8F0"/>
  <text x="74" y="786" text-anchor="middle" fill="#64748B" font-size="10">Beranda</text>
  <circle cx="223" cy="781" r="24" fill="#0EA5E9"/>
  <text x="223" y="788" text-anchor="middle" fill="white" font-size="20">+</text>
  <circle cx="300" cy="781" r="20" fill="#E2E8F0"/>
  <text x="300" y="786" text-anchor="middle" fill="#64748B" font-size="10">Profil</text>
  
  <!-- Watermark -->
  <text x="187" y="800" text-anchor="middle" fill="#CBD5E1" font-size="10">Monev Add Transaction</text>
</svg>
