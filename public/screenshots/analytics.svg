<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="375" height="812" fill="#F0F9FF"/>
  
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#0EA5E9"/>
  <text x="187" y="28" text-anchor="middle" fill="white" font-size="14" font-weight="600">9:41</text>
  
  <!-- Header -->
  <rect x="0" y="44" width="375" height="60" fill="white"/>
  <text x="40" y="82" fill="#0F172A" font-size="18" font-weight="700">Analisa AI</text>
  
  <!-- AI Insight Card -->
  <rect x="20" y="120" width="335" height="140" rx="16" fill="linear-gradient(135deg, #8B5CF6, #EC4899)"/>
  <text x="40" y="155" fill="white" font-size="14" font-weight="600">💡 Insight Minggu Ini</text>
  <text x="40" y="185" fill="white" font-size="13" line-height="1.6">Pengeluaran makanmu naik 25% dari minggu lalu. Coba masak sendiri untuk hemat hingga Rp 200rb/minggu!</text>
  
  <!-- Spending Chart -->
  <rect x="20" y="280" width="335" height="180" rx="16" fill="white"/>
  <text x="40" y="315" fill="#0F172A" font-size="16" font-weight="700">Pengeluaran per Kategori</text>
  
  <!-- Bar Chart -->
  <rect x="40" y="340" width="40" height="80" rx="4" fill="#F59E0B"/>
  <text x="60" y="435" text-anchor="middle" fill="#64748B" font-size="10">Makan</text>
  <text x="60" y="330" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">45%</text>
  
  <rect x="105" y="370" width="40" height="50" rx="4" fill="#3B82F6"/>
  <text x="125" y="435" text-anchor="middle" fill="#64748B" font-size="10">Transport</text>
  <text x="125" y="360" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">25%</text>
  
  <rect x="170" y="390" width="40" height="30" rx="4" fill="#8B5CF6"/>
  <text x="190" y="435" text-anchor="middle" fill="#64748B" font-size="10">Hiburan</text>
  <text x="190" y="380" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">15%</text>
  
  <rect x="235" y="405" width="40" height="15" rx="4" fill="#EC4899"/>
  <text x="255" y="435" text-anchor="middle" fill="#64748B" font-size="10">Lainnya</text>
  <text x="255" y="395" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">15%</text>
  
  <!-- Budget Progress -->
  <rect x="20" y="480" width="335" height="100" rx="16" fill="white"/>
  <text x="40" y="515" fill="#0F172A" font-size="16" font-weight="700">Budget Minggu Ini</text>
  <text x="335" y="515" text-anchor="end" fill="#F59E0B" font-size="14" font-weight="700">75% terpakai</text>
  <rect x="40" y="535" width="255" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="40" y="535" width="191" height="12" rx="6" fill="#F59E0B"/>
  <text x="40" y="565" fill="#64748B" font-size="12">Rp 1.125.000 / Rp 1.500.000</text>
  
  <!-- Tips -->
  <rect x="20" y="600" width="335" height="80" rx="16" fill="#ECFDF5"/>
  <text x="40" y="630" fill="#059669" font-size="14" font-weight="700">💰 Tip Hemat</text>
  <text x="40" y="655" fill="#047857" font-size="13">Bawa bekal dari rumah bisa hemat Rp 500rb/bulan!</text>
  
  <!-- Bottom Nav Placeholder -->
  <rect x="0" y="750" width="375" height="62" fill="white" stroke="#E2E8F0"/>
  <circle cx="74" cy="781" r="20" fill="#E2E8F0"/>
  <text x="74" y="786" text-anchor="middle" fill="#64748B" font-size="10">Beranda</text>
  <circle cx="223" cy="781" r="24" fill="#0EA5E9"/>
  <text x="223" y="788" text-anchor="middle" fill="white" font-size="20">+</text>
  <circle cx="300" cy="781" r="20" fill="#E2E8F0"/>
  <text x="300" y="786" text-anchor="middle" fill="#64748B" font-size="10">Profil</text>
  
  <!-- Watermark -->
  <text x="187" y="800" text-anchor="middle" fill="#CBD5E1" font-size="10">Monev AI Analytics</text>
</svg>
